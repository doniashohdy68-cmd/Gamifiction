<style>
:root{--bg:#fff3d6;--card:#fffdf6;--tx:#3a2a12;--mut:#8a7550;--pri:#e8890c;--bd:#f0d79a;--sea:#7cc8ee;--land:#f2d28a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2433;--card:#26324a;--tx:#f6efe0;--mut:#b9c2d6;--bd:#3d4d6e;--sea:#2a5f86;--land:#9c8450;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c2433;--card:#26324a;--tx:#f6efe0;--mut:#b9c2d6;--bd:#3d4d6e;--sea:#2a5f86;--land:#9c8450;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:12px;position:relative;z-index:1}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(#5ec3f0,#fde8a8 70%);--cl:#fff}
#bg svg{width:100%;height:100%;display:block}
#bg.map{background:linear-gradient(#7fd0f3,#ffe9b0 75%)}
#bg.sun{background:linear-gradient(#4fb4ea,#ffe9a0 75%)}
#bg.rain{background:linear-gradient(#6f8aa3,#c9d9e5 75%);--cl:#7d8fa3}
#bg.sand{background:linear-gradient(#f4b95a,#fbe3a6 75%)}
#bg.snow{background:linear-gradient(#8fb2d6,#eaf3fb 75%)}
#bg.win{background:linear-gradient(#5ec3f0,#ffe08a 75%)}
#bg .cl ellipse{fill:var(--cl)}
#bg .cl{animation:dr 70s linear infinite}#bg .c2{animation-duration:110s;animation-delay:-40s}
@keyframes dr{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
#bg .rays{animation:sp 30s linear infinite;transform-origin:150px 110px}
@keyframes sp{to{transform:rotate(360deg)}}
#bg .mt{opacity:0}#bg.snow .mt{opacity:1}
#bg.rain .sun,#bg.snow .sun{opacity:.15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg{filter:brightness(.55)}}
:root[data-theme="dark"] #bg{filter:brightness(.55)}
.card{background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 5px 0 var(--bd)}
h1{font-size:30px;margin:4px 0;text-align:center;color:var(--pri)}
h2{font-size:21px;margin:0}
.c{text-align:center}.mut{color:var(--mut);font-size:15px}
.btn{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-radius:16px;padding:13px;font:inherit;font-weight:800;font-size:20px;cursor:pointer;margin-top:10px;box-shadow:0 5px 0 #b36200}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b36200}
input{width:100%;padding:12px;border-radius:14px;border:3px solid var(--bd);background:var(--card);color:var(--tx);text-align:center;font:inherit;font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
.stamps{display:flex;justify-content:center;gap:8px;margin:6px 0}
.stp{width:46px;height:46px;border-radius:50%;border:3px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:24px;filter:grayscale(1);opacity:.45}
.stp.on{border-style:solid;border-color:var(--pri);filter:none;opacity:1;background:var(--card)}
svg{width:100%;height:auto;display:block;border-radius:18px;border:3px solid var(--bd)}
.pin{cursor:pointer}
.pin text.l{font-size:11px;font-weight:700;fill:#3a2a12;paint-order:stroke;stroke:#fff8;stroke-width:3px}
.pulse{animation:pl 1.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{50%{transform:scale(1.25)}}
#kid{transition:transform 1.2s cubic-bezier(.5,0,.3,1)}
.scene{position:relative;height:150px;border-radius:16px;overflow:hidden;margin-bottom:10px;border:3px solid var(--bd)}
.scene .g{position:absolute;bottom:0;left:0;right:0;height:34px}
.scene .em{position:absolute;font-size:54px;top:14px;inset-inline-start:16px;animation:fl 3s ease-in-out infinite}
.scene .kid{position:absolute;bottom:20px;inset-inline-end:18px;font-size:50px;animation:bn 1.6s infinite}
.p{position:absolute;top:-30px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(190px)}}
@keyframes fl{50%{transform:translateY(8px) rotate(6deg)}}
@keyframes bn{50%{transform:translateY(-8px)}}
.say{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:16px;margin-bottom:8px}
.q{font-size:21px;font-weight:800;margin:6px 0 4px}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:14px;padding:11px 14px;margin-top:9px;cursor:pointer;font:inherit;font-size:19px;font-weight:600;box-shadow:0 4px 0 var(--bd)}
.opt.ok{background:#2e9e5b;border-color:#2e9e5b;color:#fff;box-shadow:none}
.opt.no{background:#d64545;border-color:#d64545;color:#fff;box-shadow:none;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.cf{position:fixed;top:-30px;font-size:28px;z-index:9;pointer-events:none;animation:cf 2.2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.big{font-size:70px;animation:bn 1.4s infinite}.code{font-size:36px;letter-spacing:8px;font-weight:800;color:var(--pri);margin:6px 0}
.cert{border:5px double var(--pri);border-radius:22px;padding:16px}
</style>
</head>

<script>

];

function h(x){app.innerHTML=x}
function bg(t){document.getElementById("bg").className=t}
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function confetti(){var E=["⭐","🎉","☀️","🌧️","❄️","🌴"];for(var i=0;i<26;i++){var s=document.createElement("span");s.className="cf";s.textContent=E[i%6];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},3200,s)}}

var CD=[4,7,1,9,3],HN=["الطقس يصف حالة الجو في فترة قصيرة (يوم أو أسبوع)، والمناخ في فترة طويلة (سنوات). الفرق الأساسي هو الفترة الزمنية.","موقع مصر الفلكي جعلها في الإقليم الصحراوي الحار. المسطحات المائية تعتدل الحرارة، والمنخفضات أحر والمرتفعات أبرد.","معظم أراضي مصر صحراوية حارة. إقليم البحر المتوسط حار جاف صيفًا ودافئ ممطر شتاءً، وزراعته على الأمطار الشتوية.","الشمس تتعامد صيفًا على مدار السرطان، وتسقط الأمطار وتسود البرودة شتاءً، وتنشط رياح الخماسين في الربيع.","تسقط الثلوج شتاءً على جبل كاترين، والخماسين رياح رمال في الربيع، والحرارة صيفًا أعلى في المناطق الداخلية."];

 G={name:"",s:0,qi:0,lives:3,stars:0,first:true,stamps:[],t0:Date.now()};
